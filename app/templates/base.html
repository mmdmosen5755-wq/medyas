<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}پنل مدیریت{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--card:#fff;--ink:#111;--mut:#777;--pri:#111;--acc:#4f46e5;--ok:#15803d;--bad:#b91c1c;--line:#ececec;--soft:#f4f4f5}
@media (prefers-color-scheme:dark){:root{--bg:#0b0b0c;--card:#131315;--ink:#ededed;--mut:#8b8b92;--pri:#ededed;--acc:#818cf8;--line:#222226;--soft:#1a1a1d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;font-size:15px}
nav{background:var(--bg);border-bottom:1px solid var(--line);padding:0 20px;display:flex;gap:2px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
nav b{margin-inline-end:20px;padding:14px 0;font-weight:700;letter-spacing:-.2px}
nav a{padding:14px 12px;color:var(--mut);text-decoration:none;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-color:var(--ink);font-weight:500}
nav form{margin-inline-start:auto}
main{max-width:920px;margin:32px auto;padding:0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;margin:0 0 20px;letter-spacing:-.3px}
h2{font-size:14px;font-weight:700;margin:0 0 4px;color:var(--ink)}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat span{display:block;color:var(--mut);font-size:13px}.stat b{font-size:28px;font-weight:700;letter-spacing:-.5px}
label{display:block;margin:16px 0 6px;font-weight:500;font-size:13px;color:var(--mut)}
small{color:var(--mut);font-size:12.5px}
input,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;outline:none;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--acc)}
input[dir=ltr],textarea[dir=ltr]{text-align:left}
button,.btn{background:var(--pri);color:var(--bg);border:0;border-radius:8px;padding:9px 18px;font:inherit;font-weight:500;cursor:pointer;text-decoration:none;display:inline-block;transition:opacity .15s}
button:hover{opacity:.85}
button.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-weight:400}
button.ghost:hover{color:var(--ink);opacity:1}
button.bad{background:var(--bad);color:#fff}button.ok{background:var(--ok);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:500;font-size:12.5px}
.tbl{overflow-x:auto}
.flash{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:14px}
.flash.err{border-color:var(--bad);color:var(--bad)}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;background:var(--soft);color:var(--mut)}
.pill.ok{background:rgba(21,128,61,.12);color:var(--ok)}.pill.bad{background:rgba(185,28,28,.12);color:var(--bad)}.pill.warn{background:rgba(180,83,9,.12);color:#b45309}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{width:90px}
.status{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.status div{display:flex;gap:8px;align-items:center;font-size:14px}
a{color:var(--acc)}
</style>
</head>
<body>
{% if page != 'login' %}
<nav>
  <b>پنل انتشار</b>
  <a href="/" class="{{ 'on' if page=='dashboard' }}">داشبورد</a>
  <a href="/settings" class="{{ 'on' if page=='settings' }}">تنظیمات</a>
  <a href="/users" class="{{ 'on' if page=='users' }}">کاربران</a>
  <a href="/agent" class="{{ 'on' if page=='agent' }}">دستیار هوشمند</a>
  <a href="/payments" class="{{ 'on' if page=='payments' }}">پرداخت‌ها</a>
  <form method="post" action="/logout"><button class="ghost">خروج</button></form>
</nav>
{% endif %}
<main>
{% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
